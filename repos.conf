# repos.conf — build 拉取清单（bmake / POSIX sh 双解析格式）
#
# 约定：每行是标准 shell 变量赋值（bmake 也接受带引号的字符串赋值）：
#   REPO_<NAME>="<url> <branch-or-sha> <local-subdir> <role>"
# 字段用空格分隔，第 2 字段是分支名或 40 位 commit sha；role 取值：
#   build = make setup 拉取并注入补丁后进入构建
#   pkg   = make setup 拉取，仅作为 ports-extra port 的源（WRKSRC）
#   ref   = 仅人工参考，make setup 不拉取
# setup 完成后把实际检出的 sha 写入 ./.repo-manifest。
#
# 版本泛化模型（跟随新 FreeBSD）：
#   - 只改 REPO_SRC / REPO_PORTS 两行 pin 与 conf/freebsd.mk 的版本锚点；
#   - 其余仓库分支策略不变（各自仍指向自己的稳定/debug 分支）；
#   - 升级流程详见 README.md「随 FreeBSD 升级」一节。

# ---- FreeBSD 基线（构建输入，mirror 在迁移组织） ----
# 要求：alex6357-truenas-migrate/src 与 /ports 分别镜像 freebsd 上游；
# 各自分支头须包含下述 pin commit（src=releng/15.1 @aadd58dddcbc；
# ports=2026Q3 @d870b633c555）。若组织内缺对应分支，push 时请把
# releng/15.1 与 2026Q3 一并带上。
REPO_SRC="https://github.com/alex6357-truenas-migrate/src.git aadd58dddcbc78f4d5594827b46b5633552b15ce src build"
REPO_PORTS="https://github.com/alex6357-truenas-migrate/ports.git d870b633c555cfe87437686a0f0b5ca202fbb74b ports build"

# ---- TrueNAS 运行时仓库（ports-extra 中 port 的源；本地种子在 nas-build/ 下） ----
REPO_MIDDLEWARE="https://github.com/alex6357-truenas-migrate/middleware.git truenas/13.3-stable middleware pkg"
REPO_WEBUI="https://github.com/alex6357-truenas-migrate/webui.git truenas/13.3-stable webui pkg"
REPO_LICENSELIB="https://github.com/alex6357-truenas-migrate/licenselib.git master licenselib pkg"
REPO_PYBSD="https://github.com/alex6357-truenas-migrate/py-bsd.git master py-bsd pkg"

# iocage 决策（P5 终）：保留 fork（含 tarfile 安全修复/basejail/plugin），
# ports-extra/sysutils/iocage 用 USE_GITHUB 拉这个 pin。
REPO_IOCAGE="https://github.com/alex6357-truenas-migrate/iocage.git d8b3d7e11256db59a98c588259eec5637ec92123 iocage pkg"

# ---- ports-extra 各 port 的外部 GitHub 源仓库（pin 与各自 GH_TAGNAME 对齐） ----
# 注：REPO_ZFS 已删除（zfs sewage 用 15.1 base 2.4.2；fork 2.2.5 已无意义）；
#     REPO_WSDD 已删除（上游 ports 有 net/py-wsdd @christgau 0.9，直接用上游）；
#     REPO_MIGRATE93/REPO_MIGRATE113 已删除（放弃 9.3/11→15.1 过渡迁移路径）；
#     REPO_PKGBUILD_LEGACY 已删除（pkgbase 取代之）。
REPO_SAMBA="https://github.com/alex6357-truenas-migrate/samba.git 4fec43c0c0155240da48c33ce7dc1abcf7d8c716 samba pkg"
REPO_PYLIBZFS="https://github.com/alex6357-truenas-migrate/py-libzfs.git 98fbfdc924c3abbf15e7bb090a638b763c5769a3 py-libzfs pkg"
REPO_PYNETIF="https://github.com/alex6357-truenas-migrate/py-netif.git 9298aa9 py-netif pkg"
REPO_PYZETTAREPL="https://github.com/alex6357-truenas-migrate/py-zettarepl.git 47fc058e7bf332d282724458b582212c8b82f08f py-zettarepl pkg"
# freenas org（老私货，源仓库沿用 freenas 名下）
REPO_PYCAM="https://github.com/alex6357-truenas-migrate/py-cam.git 91f9b783e3e34e9370b3349e26c7e572b487c575 py-cam pkg"
REPO_PYBHYVE="https://github.com/alex6357-truenas-migrate/py-bhyve.git 1b6199c py-bhyve pkg"
REPO_LIBHYVEREMOTE="https://github.com/alex6357-truenas-migrate/libhyve-remote.git master libhyve-remote pkg"
REPO_MIDCLI="https://github.com/alex6357-truenas-migrate/midcli.git 5ac8045e9f1f4a6cee30fbc698df8cb01f6e9d75 py-midcli pkg"
REPO_TCSTATS="https://github.com/alex6357-truenas-migrate/truecommand-stats.git master truecommand-stats pkg"

