# repos.conf — build 拉取清单（bmake / POSIX sh 双解析格式）
#
# 约定：每行是标准 shell 变量赋值（bmake 也接受带引号的字符串赋值）：
#   REPO_<NAME>="<url> <branch-or-sha> <local-subdir> <role>"
# 字段用空格分隔，第 2 字段是分支名或 40 位 commit sha；role 取值：
#   build = make setup 拉取并注入补丁后进入构建
#   pkg   = make setup 拉取，仅作为 ports-extra port 的源（WRKSRC）
#   ref   = 仅人工参考，make setup 不拉取
# setup 完成后把实际检出的 sha 写入 ./.repo-manifest。
#
# 版本泛化模型（跟随新 FreeBSD）：
#   - 只改 REPO_SRC / REPO_PORTS 两行 pin 与 conf/freebsd.mk 的版本锚点；
#   - 其余仓库分支策略不变（各自仍指向自己的稳定/debug 分支）；
#   - 升级流程详见 README.md「随 FreeBSD 升级」一节。

# ---- FreeBSD 基线（构建输入） ----
# src 基线 = upstream releng/15.1 @ aadd58dddcbc（patches/src 的 12 个 patch
# 以此 commit 为基线 3-way 重做，见 patches/src/README.md）
REPO_SRC="https://git.freebsd.org/src.git aadd58dddcbc78f4d5594827b46b5633552b15ce src build"

# ports 基线 = upstream 2026Q3 季度分支头（与 releng/15.1 @2026-07-28 同期季度供稿）
REPO_PORTS="https://git.freebsd.org/ports.git d870b633c555cfe87437686a0f0b5ca202fbb74b ports build"

# ---- TrueNAS 运行时仓库（ports-extra 中 port 的源；本地种子在 nas-build/ 下） ----
REPO_MIDDLEWARE="https://github.com/truenas/middleware.git truenas/13.3-stable middleware pkg"
REPO_WEBUI="https://github.com/truenas/webui.git truenas/13.3-stable webui pkg"
REPO_LICENSELIB="https://github.com/truenas/licenselib.git master licenselib pkg"
REPO_PYBSD="https://github.com/truenas/py-bsd.git master py-bsd pkg"

# iocage 决策（P5 终）：保留 fork（含 tarfile 安全修复/basejail/plugin），
# ports-extra/sysutils/iocage 用 USE_GITHUB 拉这个 pin。
REPO_IOCAGE="https://github.com/truenas/iocage.git d8b3d7e11256db59a98c588259eec5637ec92123 iocage pkg"

# ---- ports-extra 各 port 的外部 GitHub 源仓库（pin 与各自 GH_TAGNAME 对齐） ----
# truenas org
REPO_ZFS="https://github.com/truenas/zfs.git 4f2aa1382 zfs pkg"
REPO_SAMBA="https://github.com/truenas/samba.git 4fec43c0c0155240da48c33ce7dc1abcf7d8c716 samba pkg"
REPO_PYLIBZFS="https://github.com/truenas/py-libzfs.git 98fbfdc924c3abbf15e7bb090a638b763c5769a3 py-libzfs pkg"
REPO_PYNETIF="https://github.com/truenas/py-netif.git 9298aa9 py-netif pkg"
REPO_PYZETTAREPL="https://github.com/truenas/py-zettarepl.git 47fc058e7bf332d282724458b582212c8b82f08f py-zettarepl pkg"
# freenas org（老私货，源仓库沿用 freenas 名下）
REPO_PYCAM="https://github.com/freenas/py-cam.git 91f9b783e3e34e9370b3349e26c7e572b487c575 py-cam pkg"
REPO_PYBHYVE="https://github.com/freenas/py-bhyve.git 1b6199c py-bhyve pkg"
REPO_LIBHYVEREMOTE="https://github.com/freenas/libhyve-remote.git master libhyve-remote pkg"
REPO_MIDCLI="https://github.com/freenas/midcli.git 5ac8045e9f1f4a6cee30fbc698df8cb01f6e9d75 py-midcli pkg"
REPO_WSDD="https://github.com/freenas/wsdd.git 0195eff4972dd5ef65c050e312f5677cda0617ec py-wsdd pkg"
REPO_MIGRATE93="https://github.com/freenas/freenas-migrate93.git master freenas-migrate93 pkg"
REPO_MIGRATE113="https://github.com/freenas/freenas-migrate113.git 72778332bc0f5bf83a9db6039e82244d25f54580 freenas-migrate113 pkg"
REPO_TCSTATS="https://github.com/freenas/truecommand-stats.git master truecommand-stats pkg"

# legacy：pkgtools 仍保留为 ref（pkgbase 迁移完成后淘汰）
