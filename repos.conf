# repos.conf — build15 拉取清单（bmake / POSIX sh 双解析格式）
#
# 约定：每行是标准 shell 变量赋值（bmake 也接受带引号的字符串赋值）：
#   REPO_<NAME>="<url> <branch-or-sha> <local-subdir> <role>"
# 字段用空格分隔，第 2 字段是分支名或 40 位 commit sha；role 取值：
#   build = make setup 拉取并注入（如启用）补丁后进入构建
#   pkg   = make setup 拉取，仅作为 ports-extra port 的源（WRKSRC）
#   ref   = 仅人工参考，make setup 不拉取
# setup 完成后把实际检出的 sha 写入 ./.repo-manifest。

# ---- FreeBSD 基线（构建输入） ----
# src 基线 = upstream releng/15.1 @ aadd58dddcbc（patches/src 的 12 个 patch
# 以此 commit 为基线 3-way 重做，见 patches/src/README.md）
REPO_SRC="https://git.freebsd.org/src.git aadd58dddcbc78f4d5594827b46b5633552b15ce src build"

# ports 基线 = upstream ports 快照；P2 定稿具体 pin。
# FIXME(P2): 选定与 releng/15.1 同期的稳定快照 SHA 后替换占位值。
REPO_PORTS="https://git.freebsd.org/ports.git P2-TODO-pinned-sha ports build"

# ---- TrueNAS 运行时仓库（ports-extra 中 port 的源） ----
# ports-extra 里 py-middlewared 等 port 的 WRKSRC 指向 work/ 下的对应目录
REPO_MIDDLEWARE="https://github.com/truenas/middleware.git truenas/13.3-stable middleware pkg"
REPO_WEBUI="https://github.com/truenas/webui.git truenas/13.3-stable webui pkg"
REPO_LICENSELIB="https://github.com/truenas/licenselib.git master licenselib pkg"
REPO_PYBSD="https://github.com/truenas/py-bsd.git master py-bsd pkg"

# iocage 决策（P5）：默认不拉 fork 仓库，直接用 ports 基线里的 sysutils/iocage。
# 保留此行以便回退决策；role=ref 时 setup 不拉取。
REPO_IOCAGE="https://github.com/truenas/iocage.git truenas/13.0-stable iocage ref"

# ---- 参考（不进构建，setup 不拉取） ----
REPO_OS_LEGACY="https://github.com/truenas/os.git truenas/13.3-stable os ref"
