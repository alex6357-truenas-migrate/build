# ---- 第三方上游（不 hold 库；pin 在各自 port 的 GH_TAGNAME） ----
# Lawouach/WebSocket-for-Python, troglobit/inadyn, pief/python-netsnmpagent,
# tianocore/edk2, OpenKMIP/PyKMIP, amotin/sedutil, anodos325/scanlnk, rhboot/grub2
