# pkg-make.conf — poudriere make.conf（core-build make_conf_pkg 迁移 + 15.1 校准）
# 注入位置：poudriere.d/make.conf

# DEFAULT_VERSIONS：对 2026Q3 基线的真实默认做 P2b 复核；15.1 时代 python 默认应为 3.11+
DEFAULT_VERSIONS=	python=3.11 python3=3.11 ssl=base
OPTIONS_UNSET=		DOCS X11 JAVA
WANT_OPENLDAP_SASL=	yes
BATCH=			yes
DISABLE_LICENSES=	yes
WRKDIRPREFIX=		/wrkdirs

# 调试符号不剥离（对应旧 DEBUG_FLAGS/CFLAGS -g + DONTSTRIP 语义）
# 迭代期关闭 -g：V8/LLVM 这类大构件带 -g 链接时 RSS 爆炸(node24 在 16GB VM
# 上被 OOM Kill 的实锤原因之一)；需要 debug 包时再放开。
#DEBUG_FLAGS=	-g
#CFLAGS+=		-g
STRIP_CMD=		true

# 重端 port(rust/node/LLVM/webkit)单 port -j 吃内存:V8 编译单元 ~1.2GB/个,
# 16GB 内存 + 20 构建者并发必死;这里把"单 port 内部并发"钉到 8
MAKE_JOBS_NUMBER_LIMIT=	8
